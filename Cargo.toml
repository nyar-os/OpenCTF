[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = ["projects/crates/ctf-domain", "projects/crates/ctf-napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenCTF Authors"]
repository = "https://github.com/nyar-os/OpenCTF"

[workspace.dependencies]
# Shared host facade for the Node-API and WebView surfaces. Cross-repo git
# dependencies pin the full 40-character revision so local builds and CI resolve
# the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }
# Shared binary framework. Pinned to the revision where `data-compression` owns
# the bounded DEFLATE/zlib/gzip envelopes and the Brotli decoder and
# `data-binary-x64` owns the x86/x64 instruction decoder behind `decode`, so
# local builds and CI resolve the commit recorded in `Cargo.lock`.
data-binary-inspect = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
data-binary-pe = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
data-binary-mach-o = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
data-binary-sevenz = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
data-compression = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200", features = ["lzma", "deflate", "brotli"] }
data-binary-probe = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
data-binary-x64 = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200", default-features = false, features = ["decode"] }
boost-crypto = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
boost-source = { git = "https://github.com/oovm/boost.rs", rev = "f191fdc4134a5be749f289315dfcacc7c4ad9200" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
open-ctf-domain = { path = "projects/crates/ctf-domain" }
open-ctf-formats = { path = "projects/crates/ctf-formats" }
open-ctf-solvers = { path = "projects/crates/ctf-solvers" }

[workspace.lints.rust]
missing_docs = "deny"

[profile.release]
lto = true
panic = "abort"
